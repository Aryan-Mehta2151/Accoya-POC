services:
  postgres:
    image: postgres:16
    container_name: ai-marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_marketing_postgres_data:/var/lib/postgresql/data

volumes:
  ai_marketing_postgres_data: